[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparq-compiler"
version = "0.1.0"
description = "Compiler Construction semester project for the Sparq language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sparq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
